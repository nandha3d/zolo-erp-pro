    <!-- Stylized Z -->
    <path d="M18 20 H42 L26 40 H42" stroke="#ffffff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  <!-- Brand Typography -->
  <text x="84" y="47" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5" fill="#f8fafc">zolo</text>
  <text x="160" y="47" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5" fill="url(#textGrad)">ERP</text>
  <text x="86" y="63" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="9" font-weight="600" letter-spacing="1.5" fill="#64748b">INTELLIGENT ERP ENGINE</text>
</svg>