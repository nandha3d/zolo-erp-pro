# /etc/nginx/sites-available/zolo-erp.conf on the VPS (symlinked into sites-enabled).
# Certificates are issued and renewed by certbot.

server {
    listen 80;
    listen [::]:80;
    server_name erp.samuraibuiness.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name erp.samuraibuiness.in;

    ssl_certificate /etc/letsencrypt/live/erp.samuraibuiness.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/erp.samuraibuiness.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/zolo-erp/public;
    index index.php;
    charset utf-8;
    client_max_body_size 50m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/zolo-erp.access.log;
    error_log /var/log/nginx/zolo-erp.error.log;

    # Private uploads are served only through the authorized download routes
    # (documents/zolo_erp_implementation_docs/PRIVATE_FILE_DEPLOYMENT.md).
    location ~* ^/documents/(sale|purchase|sale_return|purchase_return|quotation|expense|delivery|transfer|adjustment|add-payment|notification|production)(/|$) {
        return 403;
    }

    location ~* ^/images/(employee|sale_agent|supplier)(/|$) {
        return 403;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Only the front controller executes PHP.
    location = /index.php {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/zolo-erp.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 120s;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~* \.(css|js|png|jpe?g|gif|svg|ico|woff2?|ttf|eot|webp)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }
}
