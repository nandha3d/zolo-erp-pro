name: Company foundation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: fixture-root-only
          MYSQL_DATABASE: zolo_test_foundation
          MYSQL_USER: zolo_test
          MYSQL_PASSWORD: fixture-only
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pfixture-root-only"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      APP_ENV: testing
      APP_KEY: base64:dGVzdC1vbmx5LWF1ZGl0LWZpeHR1cmUta2V5LTEyMzQ=
      ERP_TEST_MYSQL: '1'
      ERP_TEST_MYSQL_DATABASE: zolo_test_foundation
      ERP_TEST_MYSQL_USER: zolo_test
      ERP_TEST_MYSQL_PASSWORD: fixture-only
      CACHE_DRIVER: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, pdo_sqlite, zip, gd, bcmath
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress --no-scripts
      - name: Migrations, committed-DDL recovery, ERP, backfill, context and reset safety
        run: php vendor/bin/phpunit -c phpunit.company.xml
      - name: Original seeded SalePro web, API and accounting smoke
        run: php vendor/bin/phpunit -c phpunit.legacy-mysql.xml
