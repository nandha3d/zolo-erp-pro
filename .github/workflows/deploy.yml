name: Deploy to VPS

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Preflight, deploy an accepted main commit, or restore an older release
        type: choice
        options: [preflight, deploy, rollback]
        default: preflight
      ref:
        description: Full commit SHA (preflight defaults to the selected branch head)
        type: string
      php_version:
        description: PHP version for the target release
        type: choice
        options: ['8.5', '8.3', '8.4']
        default: '8.5'
      current_php_version:
        description: CLI version for the currently checked-out release
        type: choice
        options: ['8.3', '8.5', '8.4']
        default: '8.3'
      approved:
        description: Confirm staging, VPS cutover, backup and rollback checks are complete
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: ERP VPS / ${{ inputs.operation }}
    if: inputs.operation == 'preflight' || (github.ref == 'refs/heads/main' && inputs.approved)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPERATION: ${{ inputs.operation }}
      REF: ${{ inputs.ref || (inputs.operation == 'preflight' && github.sha) || '' }}
      PHP_VERSION: ${{ inputs.php_version }}
      CURRENT_PHP_VERSION: ${{ inputs.current_php_version }}
    steps:
      - name: Verify release selection
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$REF" =~ ^[0-9a-f]{40}$ ]] || { echo "Select a full commit SHA."; exit 1; }
          if [[ "$OPERATION" == deploy ]]; then
            accepted=$(gh api --method GET \
              "repos/$GITHUB_REPOSITORY/actions/workflows/company-foundation.yml/runs" \
              -f head_sha="$REF" -f branch=main -f event=push -f status=success \
              --jq '.total_count')
            [[ "$accepted" -gt 0 ]] || { echo "This main commit has no successful acceptance run."; exit 1; }
          fi

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run release script over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -p "${VPS_PORT:-22}" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" "bash -s -- '$OPERATION' '$REF' '$PHP_VERSION' '$CURRENT_PHP_VERSION'" \
            < deploy/deploy.sh

      - name: Check the public login
        if: inputs.operation != 'preflight'
        run: |
          code=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            https://erp.samuraibuiness.in/login)
          echo "GET /login returned $code"
          test "$code" = 200
