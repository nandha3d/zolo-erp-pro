name: Deploy to VPS

on:
  # Deploy only the main commits that passed the acceptance suites.
  workflow_run:
    workflows: [ERP completion acceptance]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA or branch to deploy (default is the selected branch head, use an older SHA to roll back)
        required: false

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: erp.samuraibuiness.in
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Deploy over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          APP_DIR: /var/www/zolo-erp
          REF: ${{ inputs.ref || github.event.workflow_run.head_sha || github.sha }}
        run: |
          [[ "$REF" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "Invalid ref: $REF"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          # Move the checkout first, so deploy.sh always runs from the version being deployed.
          ssh -i ~/.ssh/deploy_key -p "${VPS_PORT:-22}" -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
            "set -e; cd $APP_DIR; git fetch --prune origin; git checkout --force --detach \$(git rev-parse --verify '$REF^{commit}' 2>/dev/null || git rev-parse --verify 'origin/$REF^{commit}'); bash deploy/deploy.sh"

      - name: Smoke check
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' https://erp.samuraibuiness.in/login)
          echo "GET /login -> $code"
          test "$code" = 200
